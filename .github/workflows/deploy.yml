name: Deploy to one.com

on:
  push:
    branches: [main]
    # Nur deployen, wenn sich die Website ändert (nicht bei assets/ oder Doku)
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      list_only:
        description: "Nur Ordner auf dem Server auflisten, nichts hochladen"
        type: boolean
        default: false

# Immer nur ein Upload gleichzeitig; ein neuer Push ersetzt einen wartenden
concurrency:
  group: deploy-one-com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Website bauen
        run: npm run build

      # one.com empfiehlt SFTP; Zugangsdaten unter Control Panel → Advanced settings → SSH & SFTP.
      # SFTP_REMOTE_DIR ist der Webroot der (Sub-)Domain, z. B. webroots/5dfa4a5d (siehe Control Panel → Subdomains).
      - name: Upload via SFTP
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          PORT: ${{ secrets.SFTP_PORT || '22' }}
          USER: ${{ secrets.SFTP_USERNAME }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SFTP_REMOTE_DIR }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ] || [ -z "$REMOTE_DIR" ]; then
            echo "::error::SFTP-Secrets fehlen (SFTP_HOST, SFTP_USERNAME, SFTP_PASSWORD, SFTP_REMOTE_DIR)"
            exit 1
          fi
          sudo apt-get install -y -qq lftp > /dev/null
          if [ "${{ inputs.list_only }}" = "true" ]; then
            lftp -u "$USER","$PASS" -p "$PORT" "sftp://$HOST" -e "
              set sftp:auto-confirm yes;
              echo '--- Startordner:'; pwd; cls -la;
              echo '--- webroots:'; cls -la webroots/;
              echo '--- Inhalt je Webroot:'; cls -1 webroots/*/;
              bye" || true
            exit 0
          fi
          # Ohne --delete: alte Dateien bleiben liegen, aber nichts außerhalb von dist/ wird angefasst
          lftp -u "$USER","$PASS" -p "$PORT" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            mirror --reverse --verbose --parallel=4 --exclude-glob .DS_Store dist/ '$REMOTE_DIR';
            bye"

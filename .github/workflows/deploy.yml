name: Deploy to one.com

on:
  push:
    branches: [main]
    # Nur deployen, wenn sich die ausgelieferte Seite ändert (nicht bei assets/ oder Doku)
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Immer nur ein Upload gleichzeitig; ein neuer Push ersetzt einen wartenden
concurrency:
  group: deploy-one-com
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
